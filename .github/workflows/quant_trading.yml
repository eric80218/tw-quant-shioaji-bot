name: TW 6D Quant Auto-Trading & WarRoom

on:
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '30 1,2,3,4 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Taipei

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests yfinance pandas numpy

      - name: Run 6D Quant Trading Engine
        env:
          TZ: Asia/Taipei
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          CA_PASSWORD: ${{ secrets.CA_PASSWORD }}
          SHIOAJI_CA_BASE64: ${{ secrets.SHIOAJI_CA_BASE64 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python main.py

      -       - name: Commit and Push War-Room Data
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "6D Quant Bot"
          git status
          git add docs/dashboard_data.json
          git commit -m "chore: force update dashboard_data.json $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main --force
