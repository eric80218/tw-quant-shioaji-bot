name: TW 6D Quant Auto-Trading & WarRoom

on:
  schedule:
    # 台灣時間 08:52 (盤前對帳)
    - cron: '52 0 * * 1-5'
    # 台灣時間 09:28, 10:28, 11:28, 12:28 (盤中每小時巡檢，避開30分全球排程塞車)
    - cron: '28 1,2,3,4 * * 1-5'
    # 台灣時間 12:52 與 13:05 (尾盤確認買進雙重保險，避開00分整點塞車)
    - cron: '52 4 * * 1-5'
    - cron: '5 5 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Taipei

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests yfinance pandas numpy

      - name: Run 6D Quant Trading Engine
        env:
          TZ: Asia/Taipei
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          CA_PASSWORD: ${{ secrets.CA_PASSWORD }}
          SHIOAJI_CA_BASE64: ${{ secrets.SHIOAJI_CA_BASE64 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          git pull origin main --no-edit || true
          python main.py

      - name: Commit and Push War-Room & Portfolio State
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "6D Quant Bot"
          git add data/ docs/
          git commit -m "chore: update portfolio state and war-room $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main --force
