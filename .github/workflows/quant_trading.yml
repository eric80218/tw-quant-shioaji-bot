name: TW 6D Quant Auto-Trading & WarRoom

on:
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Taipei

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Remove Legacy Init Script
        run: |
          rm -f init_bot.py

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean Hidden Characters & Run 6D Quant Engine
        env:
          TZ: Asia/Taipei
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          CA_PASSWORD: ${{ secrets.CA_PASSWORD }}
          SHIOAJI_CA_BASE64: ${{ secrets.SHIOAJI_CA_BASE64 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python -c "import glob; [open(f, 'w', encoding='utf-8').write(open(f, encoding='utf-8').read().replace('\u200b', '').replace('\ufeff', '').replace('\u00a0', ' ')) for f in glob.glob('**/*.py', recursive=True)]"
          python main.py

      - name: Commit and Push War-Room Data
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "6D Quant Bot"
          git add -A data/ docs/ src/ main.py
          git rm -f init_bot.py || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update war-room data (Taiwan Time)" && git push)
