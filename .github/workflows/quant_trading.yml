name: TW 6D Quant Auto-Trading & WarRoom

on:
  schedule:
    - cron: '50 0 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Taipei

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Remove Legacy Init Script
        run: |
          rm -f init_bot.py

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean Hidden Characters & Run 6D Quant Engine
        env:
          TZ: Asia/Taipei
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          CA_PASSWORD: ${{ secrets.CA_PASSWORD }}
          SHIOAJI_CA_BASE64: ${{ secrets.SHIOAJI_CA_BASE64 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python -c "import glob; [open(f, 'w', encoding='utf-8').write(open(f, encoding='utf-8').read().replace('\u200b', '').replace('\ufeff', '').replace('\u00a0', ' ')) for f in glob.glob('**/*.py', recursive=True)]"
          python main.py || true
          python -c "
          import json, os
          from datetime import datetime, timedelta, timezone
          tz = timezone(timedelta(hours=8))
          now_str = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')
          os.makedirs('docs', exist_ok=True)
          path = 'docs/dashboard_data.json'
          data = {}
          if os.path.exists(path):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception:
                  pass
          data['last_updated'] = now_str
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('Forced update dashboard_data.json timestamp to:', now_str)
          "

      - name: Commit and Push War-Room Data
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "6D Quant Bot"
          git rm -f init_bot.py || true
          git add -A data/ docs/ src/ main.py
          git commit -m "chore: update war-room timestamp $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push
